services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: computescope
      POSTGRES_USER: computescope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U computescope -d computescope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
